name: Build & Release Cross-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Generate default Tauri icons if missing
        run: |
          node -e '
            const fs = require("fs");
            const zlib = require("zlib");
            if (!fs.existsSync("src-tauri/icons/icon.png")) {
              fs.mkdirSync("src-tauri/icons", { recursive: true });
              const w = 32, h = 32;
              const raw = Buffer.alloc((w * 4 + 1) * h);
              for (let y = 0; y < h; y++) {
                raw[y * (w * 4 + 1)] = 0;
                for (let x = 0; x < w; x++) {
                  const i = y * (w * 4 + 1) + 1 + x * 4;
                  raw[i] = 9; raw[i+1] = 105; raw[i+2] = 218; raw[i+3] = 255;
                }
              }
              const crc32 = (buf) => {
                let c = -1;
                for (let b of buf) { c = (c >>> 8) ^ crcTable[(c ^ b) & 0xff]; }
                return (c ^ -1) >>> 0;
              };
              const crcTable = Array.from({length: 256}, (_, n) => {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
                return c;
              });
              const chunk = (type, data) => {
                const t = Buffer.from(type);
                const len = Buffer.alloc(4); len.writeUInt32BE(data.length);
                const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([t, data])));
                return Buffer.concat([len, t, data, crc]);
              };
              const ihdr = Buffer.alloc(13);
              ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4); ihdr[8] = 8; ihdr[9] = 6;
              const png = Buffer.concat([
                Buffer.from([137,80,78,71,13,10,26,10]),
                chunk("IHDR", ihdr),
                chunk("IDAT", zlib.deflateSync(raw)),
                chunk("IEND", Buffer.alloc(0))
              ]);
              fs.writeFileSync("src-tauri/icons/temp.png", png);
            }
          '
          if [ -f "src-tauri/icons/temp.png" ]; then npx tauri icon src-tauri/icons/temp.png && rm src-tauri/icons/temp.png; fi
        shell: bash

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Markdown Studio v__VERSION__'
          releaseBody: 'Windows, macOS ve Linux için otomatik oluşturulan kurulum paketleri.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}