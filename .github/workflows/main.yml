name: Build & Release Cross-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Create Tauri Icons Manually
        run: |
          mkdir -p src-tauri/icons
          node -e '
            const fs = require("fs");
            const pngBase64 = "iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAVElEQVR4nO2WQQoAIAgE7f8/3hUvQnQxQ8ElJ5nZJjNlK6lWf0y9z267d3P0n0f8Q+oD1B5g4c8D9K8C3vQZfvP3AWB/A5r3AgAAAABJRU5ErkJggg==";
            fs.writeFileSync("src-tauri/icons/icon.png", Buffer.from(pngBase64, "base64"));
            fs.writeFileSync("src-tauri/icons/32x32.png", Buffer.from(pngBase64, "base64"));
            fs.writeFileSync("src-tauri/icons/128x128.png", Buffer.from(pngBase64, "base64"));
            fs.writeFileSync("src-tauri/icons/icon.ico", Buffer.from(pngBase64, "base64"));
            console.log("Mock icons created successfully.");
          '
        shell: bash

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Markdown Studio v__VERSION__'
          releaseBody: 'Windows, macOS ve Linux için otomatik oluşturulan kurulum paketleri.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}